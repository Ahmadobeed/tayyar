<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DJI TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Rajdhani:wght@700&display=swap">
<style>
:root{
  --bg:#eef2f5; --panel:#ffffff; --ink:#10202b; --muted:#5b6b77; --line:#cfd8df;
  --accent:#0a84c6; --live:#d6282b; --stage:#0b1217;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1217; --panel:#121c24; --ink:#e6eef4; --muted:#8ea0ad; --line:#24323d;
    --accent:#3fb4f0; --live:#ff4d4f; --stage:#05090c;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1217; --panel:#121c24; --ink:#e6eef4; --muted:#8ea0ad; --line:#24323d;
  --accent:#3fb4f0; --live:#ff4d4f; --stage:#05090c;
}
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:14px 14px 28px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px 14px}
.brand{display:flex;align-items:center;gap:10px;direction:ltr}
.brand svg{width:34px;height:34px;color:var(--accent)}
.brand b{font-family:Rajdhani,"IBM Plex Sans Arabic",sans-serif;font-size:30px;letter-spacing:.04em;line-height:1}
.live{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 var(--live);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}

.stage{position:relative;aspect-ratio:16/9;background:var(--stage);border-radius:6px;overflow:hidden}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:2;background:#000}
.fallback{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;color:#9fb3c1}
.fallback p{margin:0;max-width:34ch}
.fallback a{color:#fff;background:var(--accent);padding:8px 16px;border-radius:4px;text-decoration:none;font-weight:600}
/* viewfinder corners */
.c{position:absolute;width:26px;height:26px;border:2px solid rgba(255,255,255,.75);z-index:3;pointer-events:none}
.c.tl{top:10px;left:10px;border-right:0;border-bottom:0}
.c.tr{top:10px;right:10px;border-left:0;border-bottom:0}
.c.bl{bottom:10px;left:10px;border-right:0;border-top:0}
.c.br{bottom:10px;right:10px;border-left:0;border-top:0}

.bar{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
button,.btn{font:inherit;font-weight:600;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 16px;cursor:pointer;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.panel{display:none;margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
.panel.open{display:block}
.panel label{display:block;font-weight:600;margin-bottom:6px}
.panel input{width:100%;font:inherit;direction:ltr;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.panel .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:14px;margin:8px 0 0}
.err{color:var(--live);font-size:14px;margin:8px 0 0;min-height:1.4em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
        <circle cx="8" cy="8" r="5"/><circle cx="32" cy="8" r="5"/><circle cx="8" cy="32" r="5"/><circle cx="32" cy="32" r="5"/>
        <path d="M12 12l5 5M28 12l-5 5M12 28l5-5M28 28l-5-5"/><rect x="16" y="16" width="8" height="8" rx="2"/>
      </svg>
      <b>DJI TV</b>
    </div>
    <div class="live"><span class="dot"></span><span>بث مباشر من الطائرة</span></div>
  </header>

  <div class="stage" id="stage">
    <div class="fallback">
      <p>إذا لم يظهر البث هنا، افتحه مباشرة في صفحة مستقلة.</p>
      <a id="direct" href="#" target="_blank" rel="noopener">فتح البث في نافذة جديدة</a>
    </div>
    <span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span>
  </div>

  <div class="bar">
    <button class="primary" id="fs">ملء الشاشة</button>
    <button id="reload">إعادة تحميل البث</button>
    <button id="edit">تغيير رابط البث</button>
  </div>

  <div class="panel" id="panel">
    <label for="url">رابط البث (Restream)</label>
    <input id="url" type="text" inputmode="url" autocomplete="off" placeholder="https://app.restream.io/shows/...">
    <p class="hint">يمكنك لصق الرابط فقط، أو كود iframe كاملاً.</p>
    <p class="err" id="err"></p>
    <div class="row">
      <button class="primary" id="save">حفظ وتشغيل</button>
      <button id="cancel">إلغاء</button>
    </div>
  </div>
</div>

<script>
(function(){
  var DEFAULT_URL = "https://app.restream.io/shows/025ac777-2ebf-4ab";
  var KEY = "dji-tv-url";
  var stage = document.getElementById("stage");
  var panel = document.getElementById("panel");
  var input = document.getElementById("url");
  var err = document.getElementById("err");
  var direct = document.getElementById("direct");
  var current = DEFAULT_URL;

  try { var s = localStorage.getItem(KEY); if (s) current = s; } catch(e) {}

  function mount(){
    var old = stage.querySelector("iframe");
    if (old) old.remove();
    var f = document.createElement("iframe");
    f.src = current;
    f.allow = "autoplay; fullscreen";
    f.setAttribute("allowfullscreen", "");
    f.title = "DJI TV";
    stage.insertBefore(f, stage.firstChild);
    direct.href = current;
  }

  function extract(v){
    v = (v || "").trim();
    var m = v.match(/src\s*=\s*["']([^"']+)["']/i);
    if (m) v = m[1];
    return /^https:\/\/[^\s]+$/.test(v) ? v : "";
  }

  document.getElementById("fs").onclick = function(){
    var el = stage;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fn) { try { fn.call(el); } catch(e) {} }
    else { window.open(current, "_blank", "noopener"); }
  };
  document.getElementById("reload").onclick = mount;
  document.getElementById("edit").onclick = function(){
    input.value = current; err.textContent = "";
    panel.classList.add("open"); input.focus();
  };
  document.getElementById("cancel").onclick = function(){ panel.classList.remove("open"); };
  document.getElementById("save").onclick = function(){
    var u = extract(input.value);
    if (!u) { err.textContent = "الرابط غير صالح. يجب أن يبدأ بـ https://"; return; }
    current = u;
    try { localStorage.setItem(KEY, u); } catch(e) {}
    panel.classList.remove("open");
    mount();
  };

  mount();
})();
</script>
</body>
</html>
