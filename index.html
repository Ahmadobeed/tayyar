<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تيار للشحن الداخلي | Tayyar Logistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#0A2F7A;--s:#123FA0;--bg:#f5f8fe;--tx:#1b2438;--mu:#5b6783}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{font-family:'Cairo',Tahoma,Arial,sans-serif;color:var(--tx);background:#fff;line-height:1.8}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.w{max-width:1100px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #e3e9f5}
header .w{display:flex;align-items:center;justify-content:space-between;height:68px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.brand img{width:44px;height:44px;object-fit:contain;border-radius:8px}
.brand b{display:block;font-size:17px;color:var(--p);line-height:1.2}
.brand small{font-size:11px;color:var(--mu);direction:ltr;display:block}
nav{display:flex;gap:22px;font-weight:600;font-size:15px}
nav a{padding:4px 0;border-bottom:2px solid transparent}
nav a:hover{color:var(--s);border-color:var(--s)}
.hero{position:relative;min-height:560px;display:flex;align-items:center;color:#fff;overflow:hidden}
.hbg{position:absolute;inset:0;background-size:cover;background-position:center}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,rgba(10,47,122,.92) 25%,rgba(10,47,122,.35))}
.hero .w{position:relative;z-index:2;padding-top:60px;padding-bottom:60px}
.hero h1{font-size:clamp(28px,5.2vw,52px);line-height:1.35;font-weight:800;max-width:720px}
.hero p{font-size:clamp(16px,2.2vw,19px);max-width:560px;margin:18px 0 30px;opacity:.95}
.btn{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--p);font:700 16px Cairo,sans-serif;padding:13px 30px;border-radius:8px;border:0;cursor:pointer}
.btn:hover{background:#e8efff}
section{padding:72px 0}
h2{font-size:clamp(24px,3.4vw,34px);color:var(--p);font-weight:800;margin-bottom:10px}
.bar{width:56px;height:4px;background:var(--s);border-radius:2px;margin-bottom:26px}
.about{display:grid;grid-template-columns:1fr;gap:30px;align-items:center}
.about.has{grid-template-columns:1.2fr 1fr}
.about p{font-size:17px;color:#33405c;max-width:640px}
.about img{border-radius:12px;width:100%;max-height:340px;object-fit:cover}
.alt{background:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{background:#fff;border:1px solid #dfe7f6;border-top:4px solid var(--s);border-radius:10px;overflow:hidden}
.card .im{height:150px;object-fit:cover;width:100%}
.card .in{padding:24px}
.ic{width:52px;height:52px;border-radius:10px;background:var(--p);display:grid;place-items:center;margin-bottom:14px}
.ic svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:19px;color:var(--p);margin-bottom:6px}
.card p{color:var(--mu);font-size:15px}
.why{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.why>div{padding:6px 26px;border-inline-start:3px solid var(--s)}
.why>div+div{margin-inline-start:22px}
.why h3{font-size:18px;color:var(--p)}
.why p{color:var(--mu);font-size:15px}
footer{background:var(--p);color:#fff;padding:60px 0 0}
footer h2{color:#fff}footer .bar{background:#fff}
.cb{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:28px}
.cb a{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:8px;font-weight:700;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35)}
.cb a:hover{background:#fff;color:var(--p)}
.cb a.wa{background:#25D366;border-color:#25D366;color:#fff}
.inf{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;font-size:15px}
.inf small{display:block;opacity:.7;font-size:12px}
.ltr{direction:ltr;unicode-bidi:embed;display:inline-block}
.copy{margin-top:44px;border-top:1px solid rgba(255,255,255,.2);padding:18px 0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:14px}
.vc{background:rgba(255,255,255,.14);padding:2px 14px;border-radius:20px}
.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.i.f{fill:currentColor;stroke:none}
.btn .i{font-size:20px}.cb a .i{font-size:20px}
.ic{background:linear-gradient(135deg,var(--p),var(--s));box-shadow:0 6px 14px rgba(18,63,160,.28)}
.wi{width:52px;height:52px;border-radius:12px;background:#e6eeff;color:var(--s);display:grid;place-items:center;margin-bottom:10px;font-size:28px}
.inf .row{display:flex;gap:12px;align-items:flex-start}
.ib{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:20px;flex:none}
.vw{display:inline-flex;align-items:center;gap:6px}
.card{transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(10,47,122,.14)}
/* admin */
#gear{position:fixed;left:18px;bottom:18px;z-index:90;width:52px;height:52px;border-radius:50%;border:0;background:var(--p);color:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);display:none}
#panel{position:fixed;top:0;left:0;bottom:0;width:min(440px,100%);background:#fff;z-index:100;box-shadow:4px 0 24px rgba(0,0,0,.3);transform:translateX(-102%);transition:transform .25s;display:flex;flex-direction:column}
#panel.on{transform:none}
#panel .hd{background:var(--p);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
#panel .hd button{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
#panel .bd{flex:1;overflow:auto;padding:16px 18px}
#panel .ft{padding:12px 18px;border-top:1px solid #dde;display:flex;gap:8px}
#panel h4{margin:20px 0 8px;color:var(--p);border-bottom:2px solid #e3e9f5;padding-bottom:4px}
#panel label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
#panel input[type=text],#panel textarea,#panel input[type=password]{width:100%;padding:9px 10px;border:1px solid #c9d3ea;border-radius:6px;font:14px Cairo,sans-serif}
#panel textarea{min-height:76px}
#panel input[type=color]{width:60px;height:36px;border:1px solid #c9d3ea;border-radius:6px;padding:2px}
.pb{border:0;border-radius:6px;padding:9px 16px;font:700 14px Cairo,sans-serif;cursor:pointer;background:var(--p);color:#fff}
.pb.g{background:#e8edf8;color:var(--p)}.pb.r{background:#fde8e8;color:#b42318}
.st{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--bg);padding:10px;border-radius:8px;margin-bottom:8px;font-size:14px}
.st b{color:var(--p);font-size:18px}
.th{display:flex;gap:8px;align-items:center;margin-top:4px}
.th img{width:70px;height:46px;object-fit:cover;border:1px solid #c9d3ea;border-radius:6px;background:#eee}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f9d58;color:#fff;padding:10px 22px;border-radius:8px;z-index:200;display:none}
@media(max-width:800px){
nav{gap:14px;font-size:13px}.brand b{font-size:14px}.brand small{display:none}.brand img{width:38px;height:38px}
.grid,.why,.inf,.about.has{grid-template-columns:1fr}
.why>div+div{margin-inline-start:0;margin-top:18px}
section{padding:52px 0}.hero{min-height:500px}
.hero::after{background:rgba(10,47,122,.82)}
}

.pg{display:none;min-height:60vh}.pg.on{display:block}
nav a.on{color:var(--s);border-color:var(--s)}
.ph{background:linear-gradient(135deg,var(--p),var(--s));color:#fff;padding:46px 0}
.ph h1{font-size:clamp(26px,4vw,40px);font-weight:800}
.ph p{opacity:.9;margin-top:4px;max-width:600px}.ph p:empty{display:none}
.grid{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.why{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.why>div+div{margin:0!important}
.im{height:170px}
.ph0{display:grid;place-items:center;background:#e6eeff;color:var(--s);font-size:42px}
.tag{display:inline-block;background:#e6eeff;color:var(--s);font-size:13px;font-weight:700;padding:0 12px;border-radius:20px;margin-bottom:8px}
.r{display:flex;gap:8px;align-items:center;margin-top:4px}.r .i{color:var(--s);font-size:18px}
.ba{display:flex;gap:8px;margin-top:14px}
.ba a{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--p);color:#fff;font-size:19px}
.ba a:hover{background:var(--s)}
.ci{display:inline-grid;place-items:center;width:54px;height:54px;border-radius:50%;font-size:26px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);transition:.2s}
.ci:hover{background:#fff;color:var(--p);transform:translateY(-3px)}
.ci.lwa{background:#25D366;border-color:#25D366;color:#fff}
.big{display:flex;justify-content:center;flex-wrap:wrap;gap:18px;margin-bottom:44px}
.big .ci{width:76px;height:76px;font-size:36px;background:var(--p);border-color:var(--p);color:#fff}
.big .ci:hover{background:var(--s);color:#fff}
.big .ci.lwa{background:#25D366;border-color:#25D366}.big .ci.lfb{background:#1877F2;border-color:#1877F2}
.pg .inf{color:var(--tx)}.pg .ib{background:#e6eeff;color:var(--s)}
footer{padding:34px 0 0}
.fi{display:flex;justify-content:center;gap:12px}
.copy{margin-top:24px}
#panel select{width:100%;padding:9px;border:1px solid #c9d3ea;border-radius:6px;font:14px Cairo,sans-serif}
.li{border:1px solid #d5ddf0;border-radius:8px;padding:10px;margin:10px 0;background:#fafcff}
.lh{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--p)}
.lt{font-weight:700;margin-top:6px}
@media(max-width:800px){header .w{height:auto;flex-wrap:wrap;padding-top:8px}nav{width:100%;justify-content:space-between;gap:6px;padding-bottom:6px}.big .ci{width:64px;height:64px;font-size:30px}}

html{scroll-behavior:smooth}
.pg.on{animation:pgIn .45s ease}
@keyframes pgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.13) translateX(-2%)}}
.hbg{animation:kb 22s ease-in-out infinite alternate}
.hero h1{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.hero p{animation:up .8s .15s cubic-bezier(.2,.7,.2,1) both}
.hero .btn{animation:up .8s .3s cubic-bezier(.2,.7,.2,1) both}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(18,63,160,.2),transparent);transform:skewX(-20deg);animation:sh 3.6s infinite}
@keyframes sh{0%,55%{left:-60%}100%{left:130%}}
.ph{position:relative;overflow:hidden}
.ph .w{padding-bottom:12px}
.rd,.ph::after{content:"";position:absolute;left:0;right:0;bottom:12px;height:3px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.6) 0 28px,transparent 28px 56px);animation:rd 1s linear infinite}
.rd{z-index:2}
@keyframes rd{to{background-position:56px 0}}
header{transition:box-shadow .3s}header.sc{box-shadow:0 4px 18px rgba(10,47,122,.14)}
nav a{transition:color .2s,border-color .2s}
.ic{transition:transform .3s}.card:hover .ic{transform:rotate(-6deg) scale(1.1)}
.card .im{transition:transform .6s}.card:hover .im{transform:scale(1.07)}
.wi{transition:background .25s,color .25s,transform .25s}.why>div:hover .wi{background:var(--s);color:#fff;transform:translateY(-3px)}
.ci.lwa{animation:pl 2.4s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(37,211,102,.55)}70%,100%{box-shadow:0 0 0 18px rgba(37,211,102,0)}}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease;transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes bn{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.3,1.6);opacity:0}}
#ai{position:fixed;left:18px;bottom:18px;z-index:80;display:flex;align-items:center;gap:8px;border:0;cursor:pointer;color:#fff;font:700 15px Cairo,sans-serif;padding:0 20px;height:54px;border-radius:30px;background:linear-gradient(135deg,var(--p),var(--s));box-shadow:0 6px 20px rgba(10,47,122,.4);transition:transform .2s}
#ai:hover{transform:translateY(-3px)}
#ai .i{font-size:24px}
#ai::before{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid var(--s);animation:ring 2.6s ease-out infinite;pointer-events:none}
#ai.hide{display:none}
#chat{position:fixed;left:18px;bottom:18px;z-index:85;width:min(370px,calc(100vw - 24px));height:min(520px,calc(100vh - 36px));background:#fff;border-radius:16px;box-shadow:0 14px 44px rgba(10,47,122,.35);display:flex;flex-direction:column;overflow:hidden;transform:translateY(24px) scale(.96);opacity:0;pointer-events:none;transition:transform .25s,opacity .25s;transform-origin:bottom left}
#chat.on{transform:none;opacity:1;pointer-events:auto}
.ch{background:linear-gradient(135deg,var(--p),var(--s));color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:22px}
.ch b{display:block;line-height:1.2}.ch small{opacity:.85;font-size:12px}
.ch button{margin-inline-start:auto;background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
#msgs{flex:1;overflow:auto;padding:14px;background:#f5f8fe;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:9px 14px;border-radius:14px;font-size:14.5px;line-height:1.7;animation:pop .25s ease;white-space:pre-line}
.m.b{background:#fff;border:1px solid #dfe7f6;align-self:flex-end;border-top-left-radius:4px}
.m.u{background:var(--p);color:#fff;align-self:flex-start;border-top-right-radius:4px}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:#9aa8c7;margin:0 2px;animation:bn 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
.act{display:inline-flex;margin:8px 0 0 6px;padding:3px 14px;border-radius:16px;background:var(--p);color:#fff;font-size:13px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;background:#f5f8fe}
.chips button{border:1px solid var(--s);background:#fff;color:var(--s);border-radius:16px;padding:1px 12px;font:600 13px Cairo,sans-serif;cursor:pointer}
.chips button:hover{background:var(--s);color:#fff}
.cf{display:flex;gap:8px;padding:10px;border-top:1px solid #e3e9f5}
.cf input{flex:1;min-width:0;border:1px solid #c9d3ea;border-radius:20px;padding:8px 14px;font:16px Cairo,sans-serif}
.cf button{width:42px;height:42px;border-radius:50%;border:0;background:var(--p);color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center}
@media(max-width:800px){#ai span{display:none}#ai{padding:0 15px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>

<header><div class="w">
 <div class="brand" id="brand"><img data-img="logo" alt="شعار"><div><b data-k="name"></b><small data-k="nameEn"></small></div></div>
 <nav><a href="#home" data-p="home" data-k="n1"></a><a href="#about" data-p="about" data-k="n2"></a><a href="#services" data-p="services" data-k="n3"></a><a href="#branches" data-p="branches" data-k="n4"></a><a href="#contact" data-p="contact" data-k="n5"></a></nav>
</div></header>

<div class="pg" id="p-home">
 <div class="hero"><div class="hbg" id="hbg"></div><div class="rd"></div><div class="w"><h1 data-k="heroTitle"></h1><p data-k="heroSub"></p><a class="btn" href="#contact"><svg class="i"><use href="#i-phone"/></svg><span data-k="heroBtn"></span></a></div></div>
